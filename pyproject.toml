[project]
name = "arccharcalc"
version = "0.1.0"
description = "Insulator flashover arc characteristics calculator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
arccharcalc = "arccharcalc:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
